  <style>
    html {
      -ms-touch-action: none;
    }

    body,
    canvas,
    div {
      display: block;
      outline: none;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);

      user-select: none;
      -moz-user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      -khtml-user-select: none;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    /* Remove spin of input type number */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      /* display: none; <- Crashes Chrome on hover */
      -webkit-appearance: none;
      margin: 0;
      /* <-- Apparently some margin are still there even though it's hidden */
    }

    body {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      margin: 0;

      cursor: default;
      color: #888;
      background-color: #000;

      text-align: center;
      font-family: Helvetica, Verdana, Arial, sans-serif;

      display: flex;
      flex-direction: column;

      /* fix bug: https://github.com/cocos-creator/2d-tasks/issues/791 */
      /* overflow cannot be applied in Cocos2dGameContainer, 
  otherwise child elements will be hidden when Cocos2dGameContainer rotated 90 deg */
      overflow: hidden;
    }

    #Cocos2dGameContainer {
      position: absolute;
      margin: 0;
      left: 0px;
      top: 0px;

      display: -webkit-box;
      -webkit-box-orient: horizontal;
      -webkit-box-align: center;
      -webkit-box-pack: center;
    }

    canvas {
      background-color: rgba(0, 0, 0, 0);
    }

    a:link,
    a:visited {
      color: #666;
    }

    a:active,
    a:hover {
      color: #666;
    }

    p.header {
      font-size: small;
    }

    p.footer {
      font-size: x-small;
    }

    #splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #171717 url(./splash.png) no-repeat center;
      background-size: 40%;
    }

    .progress-bar {
      background-color: #1a1a1a;
      position: absolute;
      left: 25%;
      top: 80%;
      height: 15px;
      padding: 5px;
      width: 50%;
      /*margin: 0 -175px;         */
      border-radius: 5px;
      box-shadow: 0 1px 5px #000 inset, 0 1px 0 #444;
    }

    .progress-bar span {
      display: block;
      height: 100%;
      border-radius: 3px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .5) inset;
      transition: width .4s ease-in-out;
      background-color: #34c2e3;
    }

    .stripes span {
      background-size: 30px 30px;
      background-image: linear-gradient(135deg, rgba(255, 255, 255, .15) 25%, transparent 25%,
          transparent 50%, rgba(255, 255, 255, .15) 50%, rgba(255, 255, 255, .15) 75%,
          transparent 75%, transparent);

      animation: animate-stripes 1s linear infinite;
    }

    @keyframes animate-stripes {
      0% {
        background-position: 0 0;
      }

      100% {
        background-position: 60px 0;
      }
    }

    @font-face {
      font-family: ArialBold;
      src: url("../common/assets/fonts/arial-bold/arial-bold.ttf") format("truetype"),
        /* Safari, Android, iOS */
        url("../common/assets/fonts/arial-bold/arial-bold.woff") format("woff"),
        /* Modern Browsers */
        url("../common/assets/fonts/arial-bold/arial-bold.woff2") format("woff2");
      /* Modern Browsers */
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: ArialBlack;
      src: url("../common/assets/fonts/arial-black/arial-black.ttf") format("truetype"),
        /* Safari, Android, iOS */
        url("../common/assets/fonts/arial-black/arial-black.woff") format("woff"),
        /* Modern Browsers */
        url("../common/assets/fonts/arial-black/arial-black.woff2") format("woff2");
      /* Modern Browsers */
      font-weight: normal;
      font-style: normal;
    }
  </style>
