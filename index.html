  <script>
    function getParameterByName(name, url) {
      if (!url) {
        url = window.location.href;
      }
      name = name.replace(/[\[\]]/g, "\\$&");
      var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
        results = regex.exec(url);
      if (!results) return null;
      if (!results[2]) return null;
      return decodeURIComponent(results[2].replace(/\+/g, " "));
    }

    function decodeM7(oriString) {
      if (oriString == "N9ic") return "live22";
      else if (oriString == "gKd2") return "live22cash";
      else if (oriString == "w6HT") return "live22gbl";
      else if (oriString == "16Sy") return "gsoft";
      else return "live22";
    }

    function appendBackground(startGameData) {
      /// detect if operator choose to hide landing page info
      if (isShowBrandElement(startGameData.operatorCode) == false) {
        let preloadBG = document.getElementById("preloadBg");
        if (preloadBG) preloadBG.style.display = "none";
        let brandLogo = document.getElementById("brandLogo");
        if (brandLogo) brandLogo.style.display = "none";
        let loadingIcon = document.getElementById("loadingIcon");
        if (loadingIcon) loadingIcon.style.display = "none";
        return;
      }

      let operatorCode = startGameData.operatorCode;
      let version = "?v=1";
      if (operatorCode != null) {
        /// customize operators
        // let customizeOperatorDictonaries = [
        //     // { key: "x500MYR", bgKey: "x500.jpg" },
        //     // { key: "x500THB", bgKey: "x500.jpg" },
        //     // { key: "918gt3MYR", bgKey: "918.jpg" },
        //     // { key: "918gt3THB", bgKey: "918.jpg" },
        // ];
        /// validate operator
        // let operatorBGKey = customizeOperatorDictonaries.find((data) => data.key == operatorCode)?.key;
        if (operatorCode.includes("PBG")) {
          // document.getElementById("preloadBg").style.content = "url(./common/preload/background/" + operatorBGKey + version + ")";
          document.getElementById("preloadBg").className = "preloadBg";
          let brandLogo = document.getElementById("brandLogo");
          if (brandLogo) brandLogo.style.display = "none";
          let loadingIcon = document.getElementById("loadingIcon");
          if (loadingIcon) {
            loadingIcon.style.display = "none";
          }
        }
      }
    }

    function appendBrandLogo(brandCode) {
      let container = document.getElementById("nav3");
      if (container) {

        if (isShowBrandElement(brandCode)) {
          // icon
          // let icon_className = "iconWeGaming";
          let icon_className = null;
          if (icon_className != null) {
            let newDiv = document.createElement("div");
            newDiv.className = icon_className;
            newDiv.id = "brandLogo";
            newDiv.style.position = "fixed";
            container.appendChild(newDiv);
          }

          // iconLoading
          // let loading_className = "iconLoading";
          let loading_className = null;
          if (loading_className != null) {
            let newDiv = document.createElement("div");
            newDiv.className = loading_className;
            // newDiv.style.position = "fixed";
            container.appendChild(newDiv);
          }
        } else {
          var newDiv = document.createElement("div");
          newDiv.id = "lottie";
          container.appendChild(newDiv);
          var anim = lottie.loadAnimation({
            container: newDiv,
            renderer: "svg",
            loop: true,
            autoplay: true,
            animationData: window["GFGLogoAnimationData"],
          });
        }
      }
    }

      }
    }

    HideFunplayLog();

    var tostring = {
      _keyStr: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=",
      ee: function (e) {

        var f = 0;
        e = e.replace(/[^A-Za-z0-9\+\/\=]/g, "");
        while (f < e.length) {
          s = this._keyStr.indexOf(e.charAt(f++));
          o = this._keyStr.indexOf(e.charAt(f++));
          u = this._keyStr.indexOf(e.charAt(f++));

        }
        t = tostring._utf8_decode(t);

      },
      _utf8_encode: function (e) {
        e = e.replace(/\r\n/g, "\n");
        var t = "";
        for (var n = 0; n < e.length; n++) {
          var r = e.charCodeAt(n);
          if (r < 128) {
            t += String.fromCharCode(r);
          } else if (r > 127 && r < 2048) {
            t += String.fromCharCode((r >> 6) | 192);
            t += String.fromCharCode((r & 63) | 128);
          } else {
            t += String.fromCharCode((r >> 12) | 224);
            t += String.fromCharCode(((r >> 6) & 63) | 128);
            t += String.fromCharCode((r & 63) | 128);

    function AssignPluginKeys(rawData) {
      let data = [];

      rawData = rawData.substring(1, rawData.length - 1);

      let lastMarker = 0;
      for (let i = 0; i < rawData.length; i++) {
        if (rawData[i] == ",") {
          data.push(rawData.substring(lastMarker, i));
          lastMarker = i + 1;
        } else if (i == rawData.length - 1) {
          data.push(rawData.substring(lastMarker, i + 1));
        }
      }

      window.pluginKeys = data;
    }

      if (isOnIOS()) {
        setTimeout(() => {
          ToggleBlocker();

    function ToggleBlocker() {
      // let screenOrientation = window.outerWidth > window.outerHeight ? "horizontal" : "vertical";
      // // if (window.vgrot == 0) {
      // if (window.vgrot == 1) {
      //     var scrnBlocker = document.getElementById("screen-blocker");
      //     if (scrnBlocker) scrnBlocker.style.display = screenOrientation == "horizontal" ? "block" : "none";
      // }

      var scrnWidth = isOnIOS() && isPWA() ? window.outerWidth : window.innerWidth;
      var scrnHeight = isOnIOS() && isPWA() ? window.outerHeight : window.innerHeight;
      /* 0 = landscape only
       * 1 = portrait only
       * 2 = adaptive (responsive)
       */

      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isM = isMobile(ua, "");
      if (!isM && ua.toLowerCase().indexOf("ipad") != -1) isM = 2;

      var isGoingBlock = false;
      var scrnBlocker = document.getElementById("screen-blocker");

      // check blocker
      switch (window.vgrot) {
        case 0:
          isGoingBlock = scrnHeight > scrnWidth && isM;
          if (scrnBlocker) scrnBlocker.style.display = isGoingBlock ? "block" : "none";
          break;
        case 1:
          isGoingBlock = scrnWidth > scrnHeight && isM;
          if (scrnBlocker) scrnBlocker.style.display = isGoingBlock ? "block" : "none";
          break;
      }

      // check image
      var scrnImage = document.getElementById("screen-image");
      if (scrnImage) scrnImage.style.transform = scrnWidth > scrnHeight ? "rotate(270deg)" : "rotate(0deg)";

      // check message
      var lang = getParameterByName("param7") == null ? "en-us" : getParameterByName("param7");
      switch (lang) {
        case "zh-cn":
          var localScrnMsg = document.getElementById("screen-message-chn");
          if (localScrnMsg) {
            localScrnMsg.style.display = isGoingBlock ? "block" : "none";
            localScrnMsg.style.transform = scrnWidth > scrnHeight ? "translate(0%, 130%)" : "translate(0%, 0%)";
          }
          localScrnMsg = document.getElementById("screen-message-eng");
          if (localScrnMsg) localScrnMsg.style.display = "none";
          break;
        default:
          var localScrnMsg = document.getElementById("screen-message-eng");
          if (localScrnMsg) {
            localScrnMsg.style.display = isGoingBlock ? "block" : "none";
            localScrnMsg.style.transform = scrnWidth > scrnHeight ? "translate(0%, 130%)" : "translate(0%, 0%)";
          }
          localScrnMsg = document.getElementById("screen-message-chn");
          if (localScrnMsg) localScrnMsg.style.display = "none";
          break;
      }
    }
